name: Lint Project

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false

    steps:
      - name: checkout-code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: install-uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13.13

      - name: install-python-deps
        id: install-python-deps
        run: |
          uv venv venv --python 3.13.13
          uv pip install --python venv/bin/python pre-commit ruff pylint codespell ty pyright

      - name: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: install-pnpm
        run: npm install -g pnpm

      - name: pnpm-ignore-scripts
        run: pnpm config set ignore-scripts true

      - name: pnpm-store-path
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: cache-pnpm-store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: install-node-deps
        id: install-node-deps
        run: pnpm install --frozen-lockfile --unsafe-perm

      - name: lint:precomit
        if: ${{ !cancelled() && steps.install-python-deps.outcome == 'success' && steps.install-node-deps.outcome == 'success' }}
        run: time pnpm run lint:precomit

      - name: lint:core
        if: ${{ !cancelled() && steps.install-python-deps.outcome == 'success' && steps.install-node-deps.outcome == 'success' }}
        run: time pnpm exec eslint

      - name: lint:modernui
        if: ${{ !cancelled() && steps.install-python-deps.outcome == 'success' && steps.install-node-deps.outcome == 'success' }}
        run: time pnpm run lint:modernui

      - name: lint:kanvas
        if: ${{ !cancelled() && steps.install-python-deps.outcome == 'success' && steps.install-node-deps.outcome == 'success' }}
        run: time pnpm run lint:kanvas

      - name: tsc:modernui
        if: ${{ !cancelled() && steps.install-python-deps.outcome == 'success' && steps.install-node-deps.outcome == 'success' }}
        run: time pnpm run tsc:modernui

      - name: tsc:kanvas
        if: ${{ !cancelled() && steps.install-python-deps.outcome == 'success' && steps.install-node-deps.outcome == 'success' }}
        run: time pnpm run tsc:kanvas

      - name: tsc:core
        if: ${{ !cancelled() && steps.install-python-deps.outcome == 'success' && steps.install-node-deps.outcome == 'success' }}
        run: time pnpm run tsc:core

      - name: lint:ruff
        if: ${{ !cancelled() && steps.install-python-deps.outcome == 'success' && steps.install-node-deps.outcome == 'success' }}
        run: time pnpm run lint:ruff

      - name: lint:pylint
        if: ${{ !cancelled() && steps.install-python-deps.outcome == 'success' && steps.install-node-deps.outcome == 'success' }}
        run: time pnpm run lint:pylint

      - name: lint:codespell
        if: ${{ !cancelled() && steps.install-python-deps.outcome == 'success' && steps.install-node-deps.outcome == 'success' }}
        run: time pnpm run lint:codespell

      - name: lint:ty
        if: ${{ !cancelled() && steps.install-python-deps.outcome == 'success' && steps.install-node-deps.outcome == 'success' }}
        run: time pnpm run lint:ty

      - name: lint:md
        if: ${{ !cancelled() && steps.install-python-deps.outcome == 'success' && steps.install-node-deps.outcome == 'success' }}
        run: time pnpm run lint:md
